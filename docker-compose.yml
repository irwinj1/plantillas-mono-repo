services:
  frontend:
    build:
      context: ./apps/plantilla-front
      dockerfile: Dockerfile
    container_name: plantilla-frontend
    volumes:
      - ./apps/plantilla-front:/app
      - /app/node_modules
    ports:
      - "3005:80"
    environment:
      - NODE_ENV=development
    networks:
      - plantilla_network

  php:
    build:
      context: ./apps/plantilla
      dockerfile: Dockerfile
    container_name: plantilla_php
    volumes:
      - ./apps/plantilla:/var/www
    working_dir: /var/www
    depends_on:
      - pgsql
    networks:
      - plantilla_network

  nginx:
    image: nginx:alpine
    container_name: plantilla_nginx
    ports:
      - "8005:80"
    volumes:
      - ./apps/plantilla:/var/www
      - ./apps/plantilla/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - plantilla_network

  pgsql:
    image: postgres:17-alpine
    container_name: plantilla_db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-plantilla}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plantilla_network
  
  redis:
    image: redis:alpine
    container_name: plantilla_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - plantilla_network

  mongodb:
    image: mongo:4.4-bionic
    container_name: plantilla_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - plantilla_network

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  plantilla_network:
    driver: bridge